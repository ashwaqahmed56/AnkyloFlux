[package]
name = "ankylo"
version = "0.1.0"
description = "Ankylo — universal all-format video player"
authors = ["Ankylo"]
edition = "2021"
rust-version = "1.77"
default-run = "ankylo"

[lib]
name = "ankylo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
walkdir = "2"
flate2 = "1"
ureq = { version = "2", features = ["tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
